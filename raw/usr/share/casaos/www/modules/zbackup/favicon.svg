<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64">
  <!-- Two arrows chasing each other around a small disk: sync and backup on
       the rounded white tile ZimaOS uses for built-in apps, in the ZFW/Cron
       palette (forest green accent) so the module family reads as one.
       A tester saw the same clock as Cron on the dashboard (0.1/0.2.0). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D5B"/>
      <stop offset="1" stop-color="#234B3E"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#ffffff" stroke="#e6e8eb" stroke-width="2"/>
  <!-- upper arc, arrow head at the right -->
  <path d="M33 56 A34 34 0 0 1 95 44" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <path d="M96 24 L96 46 L74 46" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lower arc, arrow head at the left -->
  <path d="M95 72 A34 34 0 0 1 33 84" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <path d="M32 104 L32 82 L54 82" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the disk in the middle -->
  <rect x="50" y="56" width="28" height="16" rx="4" fill="#0F1F1A"/>
  <circle cx="71" cy="64" r="2.5" fill="#ffffff"/>
</svg>
