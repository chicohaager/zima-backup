name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: tools/fetch-restic.sh amd64 raw/usr/libexec/zbackup/restic
      - run: tools/fetch-rclone.sh amd64 /tmp/rclone   # tests only; ZimaOS ships rclone
      - run: go vet ./...
      - run: python3 tools/check-i18n.py
      - run: RCLONE_BIN=/tmp/rclone go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: zbackup-${{ matrix.arch }}
          path: |
            zbackup-${{ matrix.arch }}.raw
            zbackup-${{ matrix.arch }}.raw.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: zbackup.raw is the name zpkg accepts (must match extension-release.zbackup)
        run: cp dist/zbackup-amd64.raw dist/zbackup.raw && (cd dist && sha256sum zbackup.raw > zbackup.raw.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
